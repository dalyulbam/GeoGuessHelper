<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALTAIYA — 지식 아틀라스</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header id="topbar">
  <div class="brand">
    <span class="orb"></span>
    <b>ALTAIYA</b><span class="sub">지식 아틀라스</span>
  </div>
  <div id="stats" class="stats"></div>
  <div class="searchbox">
    <input id="search" type="text" placeholder="행위자 검색…  (예: dubrovnik, frankopan)" autocomplete="off" spellcheck="false">
    <div id="search-drop" class="search-drop" hidden></div>
  </div>
</header>

<nav id="themebar">
  <button class="theme-chip active" data-theme="all">🌐 전체</button>
  <button class="theme-chip" data-theme="stock">📈 주식 투자</button>
  <button class="theme-chip" data-theme="realty">🏘️ 부동산</button>
  <button class="theme-chip" data-theme="trade">🚢 수출입</button>
  <button class="theme-chip" data-theme="corporate">🏢 법인사업</button>
  <button class="theme-chip" data-theme="talent">🎓 교육·인재</button>
  <button class="theme-chip" data-theme="travel">🧳 여행·문화</button>
  <button class="theme-chip" data-theme="heritage">🏛️ 역사·기록</button>
</nav>

<main id="stage">
  <svg id="map" role="application" aria-label="지식 아틀라스 전략 지도">
    <defs>
      <!-- 헥스 그리드 — 뾰족 상단 육각형(r=20), 타일 34.64×60. viewport 안에 있어 줌과 함께 스케일된다 -->
      <pattern id="hexpat" width="34.64" height="60" patternUnits="userSpaceOnUse">
        <path fill="none" stroke="#d9b653" stroke-width="0.8" opacity="0.07" d="
          M0,-20 L17.32,-10 L17.32,10 L0,20 L-17.32,10 L-17.32,-10 Z
          M34.64,-20 L51.96,-10 L51.96,10 L34.64,20 L17.32,10 L17.32,-10 Z
          M17.32,10 L34.64,20 L34.64,40 L17.32,50 L0,40 L0,20 Z
          M0,40 L17.32,50 L17.32,70 L0,80 L-17.32,70 L-17.32,50 Z
          M34.64,40 L51.96,50 L51.96,70 L34.64,80 L17.32,70 L17.32,50 Z"/>
      </pattern>
    </defs>
    <g id="viewport">
      <g id="g-world"></g>
      <rect id="hexgrid" x="0" y="0" width="2880" height="1440" fill="url(#hexpat)"/>
      <g id="g-grat"></g>
      <g id="g-influence"></g>
      <g id="g-edges"></g>
      <g id="g-nodes"></g>
    </g>
  </svg>

  <div id="tooltip" hidden></div>

  <div id="legend" class="legend">
    <div class="legend-head" id="legend-toggle">범례 <span class="chev">▾</span></div>
    <div class="legend-body">
      <div class="lg-title">관계선 — 출처 원자의 레이어</div>
      <div class="lg-row"><i style="background:#34d3a6"></i>경제</div>
      <div class="lg-row"><i style="background:#e8b34b"></i>역사</div>
      <div class="lg-row"><i style="background:#c983e8"></i>문화</div>
      <div class="lg-row"><i style="background:#5fb7dd"></i>지리</div>
      <div class="lg-row"><i style="background:#ee7fa9"></i>언어</div>
      <div class="lg-row"><i style="background:#9d92f2"></i>건축</div>
      <div class="lg-row"><i style="background:#8ed877"></i>자연</div>
      <div class="lg-title" style="margin-top:8px">행위자</div>
      <div class="lg-row">📍 거점 · 🏭 기업 · 🏛 조직</div>
      <div class="lg-row">👤 인물 · 🌉 인프라 · 👑 정치체</div>
      <div class="lg-row">🗣 문화권 · 🏞 자연</div>
      <div class="lg-note">관계선은 지식 원자의 <b>동시 서술</b>에서 왔다 —<br>행위자를 클릭해 인용 원자 원문을 확인하라.</div>
    </div>
  </div>

  <div id="zoomctl">
    <button id="z-in" title="확대">＋</button>
    <button id="z-out" title="축소">－</button>
    <button id="z-fit" title="전체 보기">⤢</button>
  </div>

  <aside id="panel" class="panel">
    <button id="panel-close" class="panel-close" title="닫기 (Esc)">×</button>
    <div id="panel-body"></div>
  </aside>

  <div id="loading" class="overlay">
    <div class="spin"></div>
    <div class="ov-msg">지도를 펼치는 중…</div>
  </div>
  <div id="apierror" class="overlay" hidden>
    <div class="ov-icon">⚠</div>
    <div class="ov-msg">백엔드(8901)에 연결할 수 없습니다.<br>
      <code>run.ps1</code> 로 두 서버를 함께 켰는지 확인하세요.</div>
    <button id="retry" class="ov-btn">다시 시도</button>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
