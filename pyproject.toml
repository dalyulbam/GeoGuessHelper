[project]
name = "geoguesshelper"
# 버전의 유일한 출처는 src/geoguesshelper/__init__.py 의 __version__ 이다 —
# 여기 숫자를 따로 두면 반드시 어긋난다(실제로 0.2.2 vs 0.5.0 으로 어긋났었다).
dynamic = ["version"]
description = "지오게서 구글 로드뷰 2분할 뷰어 · 장면 캡처 · 지리/문화/경제 분석"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# 서버측 스트리트뷰/지도 정적 캡처 합성 (Pillow) + 헤드리스 캡처(Playwright)
capture = ["pillow>=10.0", "playwright>=1.44"]
# Claude 비전 분석
analyze = ["anthropic>=0.40"]
# API 키 대신 이 PC 의 Claude 구독(OAuth)으로 호출 — 단독 소유자 모드 전용.
#   로컬에 설치된 `claude` CLI 를 SDK 가 띄워 쓴다.
#
#   **`all` 에 넣지 않는다.** Dockerfile 이 `uv sync --extra all --extra server` 로 배포
#   이미지를 만드는데, 거기서는 이 기능을 쓸 수 없다 — 다중 사용자에서 코드로 막혀 있고
#   컨테이너에 `claude` CLI 자체가 없다. 넣으면 94MB 를 받아 쓰지도 못하고 빌드만 느려진다.
#   로컬에서는 run.ps1 이 이 extra 를 같이 넣는다.
subscription = ["claude-agent-sdk>=0.2.150"]
# 전부 — **배포에 들어가는 집합**이다(Dockerfile 이 이걸 쓴다).
all = ["pillow>=10.0", "playwright>=1.44", "anthropic>=0.40"]
# 다중 사용자 서버 — 회원가입·구글 인증·개별 지식 저장소(DB)
#   SQLAlchemy 하나로 로컬 SQLite 와 배포 Postgres 를 같은 코드로 쓴다(DATABASE_URL).
#   openai 는 사용자가 ChatGPT 키를 넣었을 때만 실제로 쓰인다.
server = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "authlib>=1.3",
    "openai>=1.40",
]

[project.scripts]
geoguesshelper = "geoguesshelper.cli:main"
geoguesshelper-server = "geoguesshelper.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/geoguesshelper/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/geoguesshelper"]

[tool.hatch.build.targets.wheel.force-include]
"src/geoguesshelper/webui" = "geoguesshelper/webui"
